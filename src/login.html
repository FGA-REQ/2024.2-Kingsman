<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="login.css">
    <script src="login.js" defer></script>
</head>
<body>
    <div class="container">
        <!-- Left Side -->
        <div class="left">
            <img src="../images/imagem-principal.jpeg" alt="Illustration">
        </div>

        <!-- Right Side -->
        <div class="right">
            <div class="login-box">
                <h2>Entre na sua conta</h2>
                <form id="loginForm">
                    <input type="email" id="email" placeholder="Endereço de email" required>
                    <input type="password" id="password" placeholder="Senha" required>
                    <button type="submit">Login</button> 
                </form><br>
                <div class="social-login">
                    <button class="google-btn">
                        <span class="icon"></span> Continue com Google
                    </button>
                    <button class="github-btn">
                        <span class="icon"></span> Continue com GitHub
                    </button>
                </div>
                <p class="register-text">
                    Não tem conta? <a href="cadastro.html">Cadastre-se</a>
                </p>
            </div>
        </div>
    </div>
</body>
</html>
