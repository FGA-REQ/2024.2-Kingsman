version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: kingsman_postgres
    restart: always
    environment:
      POSTGRES_DB: kingsmandb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/16/main

volumes:
  postgres_data:
    driver: local
