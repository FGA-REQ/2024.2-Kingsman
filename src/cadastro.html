<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastre-se</title>
    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="cadastro.js>

</head>
<body>
    <div class="container">
        <!-- Left Side -->
        <div class="left">
            <img src="../images/imagem-principal.jpeg" alt="Illustration"> 
        </div>

        <!-- Right Side -->
        <div class="right">
            <div class="login-box">
                <h2>Cadastre-se</h2>
                <form id="loginForm">
                    <input type="text" id="name" placeholder="Nome" required>
                    <input type="text" id="sobrenome" placeholder="Sobrenome" required>
                    <input type="date" id="data" placeholder="Data de nascimento" required>
                    <input type="email" id="email" placeholder="Email" required>
                    <input type="password" id="senha" placeholder="Senha" required>
                    <button type=""><a href="login.html">Cadastre-se</a></button> 
               </form> 
               
                       
            </div>      
            </div>        
    
</body>
</html>
